[package]
name = "tpt-eng-props"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Umbrella: re-exports water + air + fuels fluid properties."
readme = "README.md"
keywords = ["engineering", "thermodynamics", "properties", "fluids", "steam"]
categories = ["science", "algorithms", "no-std"]
repository.workspace = true
homepage.workspace = true

[dependencies]
# tpt-math-units is kept as an explicit path with `default-features = false`:
# `workspace = true` + `default-features = false` is rejected by cargo (it cannot
# override an inherited default-features), which would break this no_std-capable
# crate. See Phase 7.2 / todo.md 7.2.
tpt-math-units = { version = "0.1.0", path = "../../../tpt-math/crates/tpt-math-units", default-features = false }

tpt-eng-props-water = { workspace = true }
tpt-eng-props-air = { workspace = true }
tpt-eng-props-fuels = { workspace = true }

[features]
default = ["std"]
std = [
    "tpt-eng-props-water/std",
    "tpt-eng-props-air/std",
    "tpt-eng-props-fuels/std",
    "tpt-math-units/std",
]
alloc = [
    "tpt-eng-props-water/alloc",
    "tpt-eng-props-air/alloc",
    "tpt-eng-props-fuels/alloc",
    "tpt-math-units/alloc",
]

[lints]
workspace = true
