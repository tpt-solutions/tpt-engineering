[package]
name = "tpt-eng-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WebAssembly bindings and browser demos for tpt-engineering."
keywords = ["engineering", "wasm", "webassembly", "demo"]
categories = ["science", "wasm"]
repository.workspace = true
homepage.workspace = true
# Built with wasm-pack for the browser demo in www/, not published to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
tpt-math-units = "0.1.0"
tpt-eng-props-water = { workspace = true }
tpt-eng-controls = { workspace = true }
tpt-eng-sections = { workspace = true }
tpt-eng-provenance = { workspace = true }

# Skip wasm-opt so the build does not need to download it.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
